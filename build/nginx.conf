# ============================================================
# wechat 站点（员工端 · SLOT 摄影师端）— 生产 Nginx 配置
# 前后端分离部署：静态资源由本容器托管，/api 反向代理到后端服务
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 员工端需上传拍摄样片 / 精修片 / 收款凭证等，上限与后端 upload.max_size_mb 对齐
    # （config/nacos 里 prod = 100、dev = 20；此处取 prod 口径，沙箱/测试环境可下调）
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # uni-app 产物中的 assets/ 是带 hash 的静态资源，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端接口反向代理（docker-compose 内服务名为 backend）
    # 员工端前缀：前端请求 /api/wechat/staff/xxx → 后端接收 /wechat/staff/xxx
    # 客户区前缀：前端请求 /api/wechat/xxx       → 后端接收 /wechat/xxx
    # （后端路由本身不含 /api，这里统一剥掉 /api 再转发）
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # 公开媒体（作品集封面/图集）：后端不鉴权目录，直连转发、**不剥前缀**
    # 员工端「作品」页展示的是同一条 /media 相对路径；缺这条会落到下方 SPA 回退
    # → 返回 index.html，表现为作品图片全打不开。
    # 客户隐私文件（样片/成片/凭证）在后端 /uploads 下且强制鉴权，不放这里。
    location /media/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 首页与静态资源（manifest 里 H5 用 hash 路由，正常不会命中回退，此处仅作兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
